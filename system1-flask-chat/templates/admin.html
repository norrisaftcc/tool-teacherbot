<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Admin — AlgoCratic TA</title></head>
<body>
  <h1>Admin Dashboard</h1>
  <h2>Groups</h2>
  {% for group in groups %}
    <p>{{ group.name }} | {{ group.clearance_level }} | {{ group.tokens_used }}/{{ group.token_budget }}</p>
  {% endfor %}
  <h2>Recent Conversations</h2>
  {% for conv in conversations %}
    <p>Group {{ conv.group_id }} @ {{ conv.started_at }}</p>
  {% endfor %}
</body>
</html>
