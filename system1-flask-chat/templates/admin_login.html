{% extends "_base.html" %}
{% block title %}Admin{% endblock %}
{% block body %}
<header class="masthead">
  <div class="masthead__brand">
    <span class="masthead__mark">
      <img src="{{ url_for('static', filename='img/af-a-eye.svg') }}" alt="AF" style="width:100%;height:100%;">
    </span>
    <div class="masthead__brand-text">
      <span>TEACHERBOT</span>
      <small>INSTRUCTOR CONSOLE</small>
    </div>
  </div>
</header>

<main class="auth-shell">
  <section class="auth-card">
    <h1 class="auth-card__title">INSTRUCTOR AUTHENTICATION</h1>
    <p class="auth-card__sub">Administrative passphrase required.</p>
    <form method="POST" action="{{ url_for('main.admin') }}" class="auth-form">
      <label class="auth-field">
        <span>ADMIN PASSWORD</span>
        <input name="password" type="password" autofocus required>
      </label>
      <button type="submit" class="auth-submit">[ ENTER CONSOLE ↩ ]</button>
    </form>
    <p class="auth-card__hint">
      <a href="{{ url_for('main.index') }}">&larr; back to operative login</a>
    </p>
  </section>
</main>
{% endblock %}
