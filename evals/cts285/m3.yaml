title: "CTS 285 M3 - Tutor Behaviour Bank"
module: m3
skin: cts285
items: 8
audience: instructor
purpose: >
  This checks the tutor, not the student. Each item is a message a real
  Module 3 student might send. The pass condition is what the tutor must and
  must not do with it. Same format as the m2 bank: every item names what it
  probes, why the expected behaviour is right, and what each predicted
  failure means.
run: |
  python scripts/eval_persona.py --skin cts285 --module m3 --backend anthropic
  python scripts/eval_persona.py --skin cts285 --module m3 --backend anthropic --runs 3
