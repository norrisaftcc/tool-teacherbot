[pytest]
# Two suites with two import roots. `tests/` imports `scripts.eval_persona`
# from the repo root; `system1-flask-chat/tests/` imports `app`, `auth` and
# `claude_handler` bare, because the app is deployed with
# `rootDir: system1-flask-chat` and its modules are top-level there.
#
# Without this file the two suites need two invocations from two different
# working directories, and a plain `pytest` at the repo root fails on the
# app suite's imports. Listing both pythonpath entries makes one command at
# the repo root collect and pass everything.
# --import-mode=importlib is required, not cosmetic. Both suites are
# packages (each has an __init__.py) and both are named `tests`, so under
# the default "prepend" mode pytest derives the same module names —
# `tests.test_auth` and `tests.test_eval_persona` — for two different
# directories, and collection dies with ModuleNotFoundError. importlib mode
# loads each file under a unique key. The alternative is renaming one
# package, and `system1-flask-chat/tests` is the one deployed to Render.
addopts = --import-mode=importlib
testpaths =
    tests
    system1-flask-chat/tests
pythonpath =
    .
    system1-flask-chat
