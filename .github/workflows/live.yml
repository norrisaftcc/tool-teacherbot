name: live

# Tests and evals that call the real Anthropic API.
#
# Deliberately NOT on pull_request. Fork PRs cannot read repository secrets,
# so they would fail with an auth error that looks like a broken test, and
# every push would spend money. tests.yml stays offline and gates PRs;
# this runs on demand and once a week.
on:
  workflow_dispatch:
  schedule:
    # 06:17 Mondays UTC. Off the hour on purpose — scheduled runs pile up at
    # :00 and get delayed.
    - cron: '17 6 * * 1'

permissions:
  contents: read
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # Mechanics. These GATE: a failure here means the app is broken against
  # the real API, not that the bot said something questionable.
  # ---------------------------------------------------------------------
  live-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: system1-flask-chat/.python-version
          cache: pip
          cache-dependency-path: system1-flask-chat/requirements.txt

      - run: pip install -r system1-flask-chat/requirements.txt

      - name: Check the secret is actually here
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # An unset or misnamed secret expands to an empty string, not an
        # error. Caught here for a legible message; REQUIRE_LIVE_TESTS below
        # catches it again at the pytest layer, and also catches a skip
        # introduced for some future reason.
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::ANTHROPIC_API_KEY is empty. The repository secret is"
            echo "::error::missing, misnamed, or not exposed to this job."
            exit 1
          fi
          echo "secret present (${#ANTHROPIC_API_KEY} chars)"

      - name: Run live tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Turns "no key" from a skip into a failure. Without it, a missing
          # secret means three skips and a green check — a job that reports
          # success having made no API calls. See tests/live_gate.py.
          REQUIRE_LIVE_TESTS: '1'
        # -m live opts in; pytest.ini deselects the marker by default.
        # -rs prints skip reasons, so if anything still skips it is visible
        # in the log rather than hidden behind a summary count.
        run: python -m pytest -m live -q -rs

  # ---------------------------------------------------------------------
  # Persona behaviour. This REPORTS and does not gate.
  #
  # K3 is frozen: "Eval flags are triage, never a verdict." Wiring the bank
  # into a merge gate would contradict it. The code agrees — eval_persona
  # main() returns 0 whether or not items are flagged — so a job that looked
  # like a gate would be one in appearance only, which is worse than not
  # having one. Read the transcript artifact.
  #
  # A weekly single sample is a data point, not a trend. Rates need --runs N
  # (#30), and that matters more now: m0-02 was retired because five samples
  # of an ill-posed item told us nothing about the model, so the next thing
  # to get wrong is reading a series of single samples as a direction.
  # ---------------------------------------------------------------------
  eval-bank:
    runs-on: ubuntu-latest
    # One job per bank, so a new bank runs the moment it is added and each
    # gets its own artifact. Adding evals/csc134/m2.yaml means adding "m2"
    # here — the offline suite already fails if a bank is malformed, but
    # nothing would notice a bank that is simply never run.
    strategy:
      fail-fast: false
      matrix:
        module: [m0, m1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: system1-flask-chat/.python-version
          cache: pip
          cache-dependency-path: system1-flask-chat/requirements.txt

      - run: pip install -r system1-flask-chat/requirements.txt

      - name: Run the csc134 ${{ matrix.module }} behaviour bank
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # pipefail matters: `python … | tee` reports *tee's* exit status, so
        # without it a crashed eval — bad key, dead model, corpus that fails
        # to load — is masked by tee succeeding at writing the traceback to a
        # file, and the job goes green.
        #
        # This is not in tension with the job being non-gating. K3 says
        # persona *flags* are not a verdict; it does not say the harness
        # crashing is fine. Flagged items still exit 0 and still produce an
        # artifact. A crash is a mechanical failure and should be red.
        run: |
          set -o pipefail
          python scripts/eval_persona.py \
            --skin csc134 --module ${{ matrix.module }} --backend anthropic \
            | tee eval-csc134-${{ matrix.module }}.txt

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-csc134-${{ matrix.module }}-${{ github.run_number }}
          path: eval-csc134-${{ matrix.module }}.txt
          retention-days: 90
