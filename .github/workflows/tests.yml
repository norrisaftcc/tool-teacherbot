name: tests

# Until now every test in this repo was run by hand, while `main` auto-deploys
# to production on push (render.yaml, autoDeploy: true). A red suite shipped.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches system1-flask-chat/.python-version, which is what Render
          # reads (rootDir is system1-flask-chat, so the repo-root runtime.txt
          # is invisible to it). CI and production must agree on this.
          python-version-file: system1-flask-chat/.python-version
          cache: pip
          cache-dependency-path: system1-flask-chat/requirements.txt

      - name: Install dependencies
        run: pip install -r system1-flask-chat/requirements.txt

      - uses: actions/setup-node@v4
        # node only, no install step. render_check.mjs evaluates the vendored
        # static/js/marked.umd.js — the bytes the browser runs — so it needs
        # nothing from npm. It used to import the npm ESM build, which meant
        # the XSS guard was testing a different bundle from the one students
        # execute, and skipping entirely whenever node_modules was absent.
        with:
          node-version: '22'

      - name: Run both suites
        # No ANTHROPIC_API_KEY here, and that is still deliberate: these are
        # the tests that run on every PR, including from forks, which cannot
        # read secrets. Everything that talks to Anthropic is mocked.
        #
        # Tests that hit the real API live in live.yml behind the `live`
        # marker, on workflow_dispatch plus a weekly schedule. pytest.ini
        # deselects that marker by default, so this run stays offline and
        # free no matter what gets added to the suite.
        run: python -m pytest -q
