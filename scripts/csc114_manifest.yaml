# Manifest for sync_course_corpus.py (CSC 114).
# Edit this file to stage new corpus content, then re-run:
#     python scripts/sync_course_corpus.py --manifest scripts/csc114_manifest.yaml
# (Absent --manifest, this file is the default for back-compat.)

upstream: https://github.com/norrisaftcc/course-csc114-template
ref: main
target: system1-flask-chat/context/csc114

# Paths under the upstream repo to copy into target/.
# The `planning/pilot_su26/` prefix is stripped from destination paths,
# so `planning/pilot_su26/crosswalk.md` lands at `target/crosswalk.md`.
strip_prefix: planning/pilot_su26/
paths:
  - planning/pilot_su26/crosswalk.md
  - planning/pilot_su26/week-01-cloud-agents/
  - planning/pilot_su26/week-02-keras-hello-world/
