# Where each file lands. Ordered, first match wins, component-aware. Applied
# to the upstream path. `reference/` below is a DESTINATION; `deny` is checked
# against upstream paths only.
map:
  # The DataMan manual is the primary source for the whole course, so it is
  # the always-on `corpus_index` window rather than part of module 1.
  - {from: module-01/final-build/18-the-dataman-manual.html, to: reference/18-the-dataman-manual.html}
  - {from: module-0-getting-started/final-build/, to: modules/m0/}
  - {from: module-01/final-build/, to: modules/m1/}
  - {from: module-02/final-build/, to: modules/m2/}
  - {from: module-02/student-facing/, to: modules/m2/}
  - {from: module-03/final-build/, to: modules/m3/}
  - {from: module-03/student-facing/, to: modules/m3/}
  - {from: module-04/final-build/, to: modules/m4/}
  - {from: module-04/templates/, to: modules/m4/}
  - {from: module-05/final-build/, to: modules/m5/}
  - {from: module-05/starter/minimal-flask-app/, to: modules/m5/starter/}
  - {from: module-06/final-build/, to: modules/m6/}
  - {from: module-06/student-facing/, to: modules/m6/}
  - {from: module-07/final-build/, to: modules/m7/}
  - {from: module-07/student-facing/, to: modules/m7/}
  - {from: module-08/final-build/, to: modules/m8/}
  - {from: module-08/student-facing/, to: modules/m8/}

# Canvas page bodies are HTML fragments; the corpus loader reads *.md only.
# Starter code is fenced so it survives as code.
transforms:
  '.html': html-to-markdown
  '.py': fence
  '.txt': fence

# Hard guard. A pattern ending "/" is a directory NAME matched at any depth;
# any other pattern is matched against the file name and the whole path with
# fnmatch (where "*" also crosses "/"). Checked against upstream paths, for
# every listed path and every file under a listed directory.
deny:
  - build-guides/          # New Quiz / simulation / rubric build specs: correct answers, per-answer feedback
  - instructor-guides/     # Norris's class scripts: facilitation and decision moments
  - planning/              # governance, decisions, status: not student material
  - reference/             # upstream-only: module-07/reference/ is the SQLite schema and reference data_store.py (M7 asks the student to write it)
  - review-target/         # module-06 graded code-review target; its key is in build-guides/
  - exemplars/             # module-06 samples of register and shape, "not assets"
  - failure-variants/      # module-07 planted-defect lab targets
  - binder/                # offline binder; holds cts285-answer-key.html
  - assignments/           # module-04/05 assignment shells: duplicates of pages, plus rubrics
  - assessments/           # module-04 assessments
  - instructor-workflows/  # weekly delivery checklist for the instructor
  - style/                 # Canvas house style and checker
  - docs/                  # course-level docs, not student pages
  - course-level/          # course-level deliverables
  - resources/             # module-01 resources/ holds an unverified manual copy; the Canvas page is the verified one
  - '*rubric*'             # graded-criteria text, even when it sits beside a student file
  - '*answer-key*'         # keys of any kind
  - '*-key.md'             # frontmatter `audience: instructor`
  - 'M[0-9]-*.md'          # module architecture / lock records
  - 00-START-HERE.md       # navigation for the builder
  - 'module-??/README.md'  # generated Canvas build-order index. NOT 'module-*/README.md': "*" crosses "/" and would also deny the M5 starter README
  - module-0-getting-started/README.md  # same, for module 0
  - AGENTS.md              # repository governance
  - CLAUDE.md              # repository governance
  # The five retired M2 elicitation-case branch pages (m2-3a ... m2-3e). They
  # hold the case reveals and are retired from Canvas, not deleted. Not
  # matched by any pattern above, so named here.
  - '*m2-3[a-e]-*'
