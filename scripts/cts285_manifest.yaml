# Manifest for sync_course_corpus.py (CTS-285, Systems Analysis & Design).
# Edit this file to stage new corpus content, then re-run:
#     python scripts/sync_course_corpus.py --manifest scripts/cts285_manifest.yaml \
#         --source /path/to/cts-285_SOURCE
#
# The upstream repository is PRIVATE, so the sync reads a local clone
# (--source) instead of cloning. `upstream` and `ref` are recorded in
# context/cts285/_provenance.txt next to the commit SHA the clone was at.
#
# STUDENT-VISIBLE MATERIAL ONLY. This bot answers students. Anything vendored
# can land in the system prompt, where no persona wording reliably holds it
# back, so `paths` is an explicit FILE allow-list (no directory entries) and
# `deny` below is a hard guard over it. A denied path in `paths` makes the
# sync raise and write nothing, because it means the allow-list is wrong.
#
# How `paths` was built: every `file` under every module's `source_dir` in
# the upstream `binder/manifest.json` (the sequence students see in Canvas),
# except the five `retired: true` M2 children (11-15, the elicitation case's
# branch pages). Those hold the case reveals; the hosted case serves them one
# at a time, and the bot must not hand over the investigation. Then the
# student-facing extras: files a student opens, copies into their own
# repository, or runs.
#
# Left out ON PURPOSE, and why:
#   module-02/student-facing/m2-simulation-class-handout.md
#       Opens "PROPOSED - NOT APPROVED - DO NOT DISTRIBUTE". It is a reopen
#       that waits on the course owner; no student has it.
#   module-03/templates/product-backlog-template.md
#       A near-duplicate of module-03/student-facing/dataman-product-backlog-template.md,
#       which is vendored. The only mention of its file name in the M3 pages
#       is inside an HTML build note, which the converter drops, so no
#       vendored page names it.
#   module-05/starter/minimal-flask-app/templates/index.html
#       A Jinja template, not a Canvas page. `transforms` is keyed by suffix,
#       so '.html' would run html-to-markdown over it and drop the <form>,
#       <input> and <button> (measured 2026-10-17). A starter file the bot
#       shows with its form missing is worse than a starter file it does not
#       have. Add it back once `transforms` can fence one path.
#   module-07/student-facing/failure-variants/
#       Planted-defect lab targets. Denied by pattern below.
#   module-04/final-build/03-prepare-..., 04-after-labs-..., 06-design-investigation-application.html
#       On disk but not in binder/manifest.json, so not in the Canvas sequence.
strip_prefix: ''
upstream: https://github.com/AMLW05/cts-285_SOURCE
ref: main
target: system1-flask-chat/context/cts285

