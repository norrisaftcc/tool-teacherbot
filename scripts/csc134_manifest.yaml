# Manifest for sync_course_corpus.py (CSC 134).
# Edit this file to stage new corpus content, then re-run:
#     python scripts/sync_course_corpus.py --manifest scripts/csc134_manifest.yaml

upstream: https://github.com/norrisaftcc/course-csc134-template
ref: main
target: system1-flask-chat/context/csc134

# Paths under the upstream repo to copy into target/.
#
# Vendoring is deliberately wider than what reaches the system prompt:
# auth.py windows the corpus to `corpus_index` plus one `active_module`
# (ADR-0002), so everything below sits on disk ready for the week it
# becomes current. The full tree is ~424KB (~106k tokens) — loading all
# of it on every message is what the window exists to prevent.
#
# `instructor-guide/` is deliberately NOT vendored: this is a
# student-facing bot.
strip_prefix: ''
paths:
  - outline/
  - modules/
  - assignments/

# Never vendor these — a course repo keeps instructor- and student-facing
# files side by side, and anything vendored can land in the system prompt
# where no persona wording reliably holds it back. Each pattern below
# targets files that say so about themselves:
#   *-key.md      frontmatter `audience: instructor`, "Do not hand to students"
#   *.STUB.md     "do not hand this stub to students" — unauthored skeletons
exclude:
  - '**/*-key.md'
  - '**/*.STUB.md'
  # Asset-slotting notes: a porting ledger for the course author. Opens
  # "SKELETON ONLY. Records intent and provenance; reconciles nothing;
  # ports/moves/renames nothing." The body is PORT / DO NOT PORT rulings,
  # non-clobber rules, and numbering-reconciliation rows — none of it
  # student-facing, and ~40% of a module window's bytes. It is also where
  # nearly every stale internal link lives.
  - '**/_assets.md'
  # Superseded walkthrough. `modules/m0/_assets.md` rules it
  # "`DO NOT PORT` (frozen provenance) — (superseded)": the deep-build pass
  # authors a fresh Mail-Run M0 lab (commit/push, no PR) and the
  # fork/branch/PR walkthrough relocates to the M8 capstone. Confirmed by
  # the course lead — first-years submit with stage/commit/push and are not
  # put in front of a PR at all. Serving this to a week-1 student teaches a
  # workflow the course deliberately does not use.
  - 'assignments/m0/02_first_pull_request.md'

# Rewrite vendored markdown. We vendor a subset of a repo whose documents
# assume the whole repo, so cross-references can point at files that exist
# upstream and not here. Observed live: asked about a due date, the bot
# correctly declined to invent one and then sent the student to
# `_tracking/course-manifest-csc134.yaml`, which does not exist in their
# world. Neutralise the pointer rather than the sentence around it.
# Order matters: the markdown-link rule must run first, or the later rules
# rewrite the link *target* and leave a still-broken `[label](prose)`.
# `_contracts/` and `_storming/` are the same kind of upstream-only planning
# directory and appear in the same sentences; stripping one of three would
# just look arbitrary.
substitutions:
  # [label](../_tracking/foo.md) -> label
  - pattern: '\[([^\]]+)\]\(/?(?:\.\./)*_(?:tracking|contracts|storming)/[^)]*\)'
    replace: '\1'
  # `_tracking/foo.md` or `_tracking/` -> prose
  - pattern: '`/?_(?:tracking|contracts|storming)/[^`]*`'
    replace: 'an internal course-planning document'
  # bare paths, e.g. inside fenced blocks
  - pattern: '/?_(?:tracking|contracts|storming)/[A-Za-z0-9_.-]+'
    replace: 'an internal course-planning document'
  # 01_workspace_setup.md ends by sending the student to the PR walkthrough
  # we exclude above. Left alone that is both a dead link and a pointer at
  # the wrong workflow.
  - pattern: '\[[^\]]+\]\(0?2_first_pull_request\.md\)'
    replace: 'the Mail Run — stage, commit, push'
  # `assignments/m0/README.md` still advertises that lab in its table and
  # time budget, so the bot would tell a week-1 student they have a PR lab
  # due. Drop any remaining line naming the file. Runs after the link rule
  # above, which has already rewritten the one line worth keeping.
  - pattern: '(?m)^.*02_first_pull_request\.md.*$\n?'
    replace: ''
